<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>岸生</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="hud">
      <div class="brand">岸生</div>
      <div class="row">
        <div class="seg" id="widths" role="group">
          <button type="button" data-w="narrow" class="on">湿草</button>
          <button type="button" data-w="river">浅沼</button>
          <button type="button" data-w="harbor">水面</button>
        </div>
        <div class="seg">
          <button type="button" id="erase">擦</button>
          <button type="button" id="undo">撤销</button>
          <button type="button" id="shot">截图</button>
        </div>
      </div>
      <div class="sliders">
        <label>
          <span>干</span>
          <input id="tide" type="range" min="0" max="100" value="52" />
          <span>满</span>
        </label>
        <label>
          <span>晨</span>
          <input id="tod" type="range" min="0" max="100" value="20" />
          <span>黄昏</span>
        </label>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
